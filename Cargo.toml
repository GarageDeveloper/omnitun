[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
vpn-core = { path = "crates/vpn-core" }
vpn-platform = { path = "crates/vpn-platform" }
vpn-fortissl = { path = "crates/vpn-fortissl" }
vpn-ipsec = { path = "crates/vpn-ipsec" }
vpn-openvpn = { path = "crates/vpn-openvpn" }
vpn-l2tp = { path = "crates/vpn-l2tp" }
vpn-wireguard = { path = "crates/vpn-wireguard" }
vpn-tls = { path = "crates/vpn-tls" }
vpn-client = { path = "crates/vpn-client" }
omnitun-engine = { path = "crates/engine" }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ipnet = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
hex = "0.4"
