[package]
name = "omnitund"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
vpn-core.workspace = true
vpn-platform.workspace = true
vpn-transport.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
ipnet.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
zeroize = "1"
libc = "0.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["user", "fs", "resource"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
toml.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# In-process engines and DNS proxies, over Unix socket pairs.
[target.'cfg(unix)'.dev-dependencies]
omnitun-engine.workspace = true
vpn-dnsproxy.workspace = true
