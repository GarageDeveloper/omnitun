[package]
name = "omnitun-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "omnitun_engine"

[dependencies]
vpn-core.workspace = true
vpn-fortissl.workspace = true
vpn-ipsec.workspace = true
vpn-openvpn.workspace = true
vpn-l2tp.workspace = true
vpn-wireguard.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize = "1"

# Interfaces handed over as descriptors; the DNS proxy (not on Windows yet).
[target.'cfg(unix)'.dependencies]
vpn-platform.workspace = true
vpn-dnsproxy.workspace = true
nix = { version = "0.31", features = ["user"] }

[target.'cfg(windows)'.dependencies]
vpn-transport.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
