[package]
name = "omnitun-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "omnitun_engine"

[dependencies]
vpn-core.workspace = true
anyhow.workspace = true
tokio.workspace = true

# The engine is Unix only for now.
[target.'cfg(unix)'.dependencies]
vpn-platform.workspace = true
vpn-fortissl.workspace = true
vpn-ipsec.workspace = true
vpn-openvpn.workspace = true
vpn-l2tp.workspace = true
vpn-wireguard.workspace = true
vpn-dnsproxy.workspace = true
async-trait.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize = "1"
nix = { version = "0.31", features = ["user"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
