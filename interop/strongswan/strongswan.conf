charon {
    load_modular = yes
    # FortiGate-style IKEv1 aggressive mode with a PSK (test only).
    i_dont_care_about_security_and_use_aggressive_mode_psk = yes
    plugins {
        include strongswan.d/charon/*.conf
    }
    filelog {
        stdout {
            default = 1
            ike = 2
            cfg = 2
            time_format = %H:%M:%S
        }
    }
}
