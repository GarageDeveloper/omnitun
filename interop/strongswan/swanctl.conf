# Test gateway. Each scenario of profiles.toml picks its connection by
# the identity it sends (local_id); the client offers one proposal, so a
# success proves that algorithm.

connections {
    v2-psk {
        version = 2
        proposals = aes256gcm16-prfsha256-ecp256, aes256-sha256-modp2048, chacha20poly1305-prfsha256-x25519, 3des-sha1-modp1024
        pools = clients
        local {
            auth = psk
            id = gw.omnitun.test
        }
        remote {
            auth = psk
            id = psk@omnitun.test
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256gcm16, aes256-sha256, chacha20poly1305, 3des-sha1
            }
        }
    }
    v2-eap {
        version = 2
        proposals = aes256gcm16-prfsha256-ecp256
        pools = clients
        local {
            auth = psk
            id = gw.omnitun.test
        }
        remote {
            auth = eap-mschapv2
            eap_id = %any
            id = eap@omnitun.test
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256gcm16
            }
        }
    }
    # Gateway certificates, with EAP or a PSK on the client side. The
    # signature scheme is global (SIGNATURES in entrypoint.sh).
    cert-rsa {
        version = 2
        proposals = aes256gcm16-prfsha256-ecp256
        pools = clients
        local {
            auth = pubkey
            certs = gw-rsa.pem
            id = gw-rsa.omnitun.test
        }
        remote {
            auth = eap-mschapv2
            eap_id = %any
            id = eap-rsa@omnitun.test
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256gcm16
            }
        }
    }
    cert-p256 {
        version = 2
        proposals = aes256gcm16-prfsha256-ecp256
        pools = clients
        local {
            auth = pubkey
            certs = gw-p256.pem
            id = gw-p256.omnitun.test
        }
        remote {
            auth = eap-mschapv2
            eap_id = %any
            id = eap-p256@omnitun.test
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256gcm16
            }
        }
    }
    cert-p384-psk {
        version = 2
        proposals = aes256gcm16-prfsha384-ecp384
        pools = clients
        local {
            auth = pubkey
            certs = gw-p384.pem
            id = gw-p384.omnitun.test
        }
        remote {
            auth = psk
            id = psk-p384@omnitun.test
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256gcm16
            }
        }
    }
    cert-rogue {
        version = 2
        proposals = aes256gcm16-prfsha256-ecp256
        pools = clients
        local {
            auth = pubkey
            certs = gw-rogue.pem
            id = gw-rogue.omnitun.test
        }
        remote {
            auth = psk
            id = psk-rogue@omnitun.test
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256gcm16
            }
        }
    }
    # Client certificates (the key would be in the Keychain), with a
    # gateway certificate or the PSK.
    cert-client-rsa {
        version = 2
        proposals = aes256gcm16-prfsha256-ecp256
        pools = clients
        local {
            auth = pubkey
            certs = gw-rsa.pem
            id = gw-rsa.omnitun.test
        }
        remote {
            auth = pubkey
            cacerts = ca.pem
            id = client-rsa@omnitun.test
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256gcm16
            }
        }
    }
    cert-client-p256 {
        version = 2
        proposals = aes256gcm16-prfsha256-ecp256
        pools = clients
        local {
            auth = pubkey
            certs = gw-p256.pem
            id = gw-p256.omnitun.test
        }
        remote {
            auth = pubkey
            cacerts = ca.pem
            id = "C=CH, O=omnitun interop, CN=client-p256"
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256gcm16
            }
        }
    }
    cert-client-psk-gateway {
        version = 2
        proposals = aes256gcm16-prfsha384-ecp384
        pools = clients
        local {
            auth = psk
            id = gw.omnitun.test
        }
        remote {
            auth = pubkey
            cacerts = ca.pem
            id = client-p384@omnitun.test
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256gcm16
            }
        }
    }
    cert-client-rogue {
        version = 2
        proposals = aes256gcm16-prfsha256-ecp256
        pools = clients
        local {
            auth = pubkey
            certs = gw-rsa.pem
            id = gw-rsa.omnitun.test
        }
        remote {
            auth = pubkey
            cacerts = ca.pem
            id = client-rogue@omnitun.test
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256gcm16
            }
        }
    }
    v1-xauth {
        version = 1
        aggressive = yes
        proposals = aes256-sha256-modp1536, aes128-sha1-modp1536, aes256-sha256-modp2048, 3des-sha1-modp1024
        pools = clients
        local {
            auth = psk
            id = gw.omnitun.test
        }
        remote-psk {
            auth = psk
            id = xauth@omnitun.test
        }
        remote-xauth {
            auth = xauth
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256-sha256-modp1536, aes256-sha256, aes256gcm16-modp1536, aes256gcm16, 3des-sha1-modp1024, 3des-sha1
            }
        }
    }
    # Main mode: the identities come encrypted in message 5. The gateway
    # picks the IKE proposals by address only (as a FortiGate picks the
    # phase1 by interface), so every IKEv1 connection offers the same.
    v1-main-xauth {
        version = 1
        proposals = aes256-sha256-modp1536, aes128-sha1-modp1536, aes256-sha256-modp2048, 3des-sha1-modp1024
        pools = clients
        local {
            auth = psk
            id = gw.omnitun.test
        }
        remote-psk {
            auth = psk
            id = xauth-main@omnitun.test
        }
        remote-xauth {
            auth = xauth
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256gcm16, aes256-sha256
            }
        }
    }
    v1-main-psk {
        version = 1
        proposals = aes256-sha256-modp1536, aes128-sha1-modp1536, aes256-sha256-modp2048, 3des-sha1-modp1024
        pools = clients
        local {
            auth = psk
            id = gw.omnitun.test
        }
        remote {
            auth = psk
            id = main@omnitun.test
        }
        children {
            net {
                local_ts = 10.99.1.0/24
                esp_proposals = aes256-sha256, 3des-sha1
            }
        }
    }
}

pools {
    clients {
        addrs = 10.99.0.0/24
        dns = 10.99.1.53
    }
}

secrets {
    ike-clients {
        secret = "omnitun-interop-psk"
    }
    eap-alice {
        id = alice
        secret = "alice-password"
    }
    xauth-alice {
        id = alice
        secret = "alice-password"
    }
}
