charon {
    load_modular = yes
    # IKEv1 aggressive mode with a PSK, as macOS does with a group name
    # (test only).
    i_dont_care_about_security_and_use_aggressive_mode_psk = yes
    plugins {
        include strongswan.d/charon/*.conf
        # Its passthrough policy for the local network would win over the
        # L2TP SA: L2TP would go out in clear, and a client that accepts
        # that (the stock one does) would hide it.
        bypass-lan {
            load = no
        }
    }
    filelog {
        stdout {
            default = 1
            ike = 2
            cfg = 2
            time_format = %H:%M:%S
        }
    }
}
