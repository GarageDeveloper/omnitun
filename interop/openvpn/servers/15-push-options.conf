# Pushed route to 10.99.0.0/16 (10.99.0.1 answers), redirect-gateway, DNS and domain.
config /etc/openvpn/common.conf
port 2015
proto udp
dev tun15
server 10.8.15.0 255.255.255.0
push "route 10.99.0.0 255.255.0.0"
push "redirect-gateway def1"
push "dhcp-option DNS 10.8.15.53"
push "dhcp-option DOMAIN omnitun.test"
