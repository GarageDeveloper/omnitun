# Shared by every server instance: servers/*.conf include it first, then
# set their port, tun device and subnet (10.8.N.0/24, server 10.8.N.1,
# which answers ping) and what they test.
dev-type tun
topology subnet
ca /pki/ca.pem
cert /pki/server.pem
key /pki/server.key
dh none
keepalive 10 60
verb 3
