# cargo deny check licenses: every dependency must be under one of these.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    # uniffi (Swift bindings): file-level copyleft, used unmodified.
    "MPL-2.0",
]
confidence-threshold = 0.9

